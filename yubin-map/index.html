<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゆうびんばんごうマップ</title>
  <meta name="theme-color" content="#e2572b">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>〒 ゆうびんばんごうマップ</h1>
      <a class="top-link" href="../">トップへ戻る</a>
    </div>
    <div class="mode-tabs" role="tablist">
      <button type="button" data-mode="free" class="active">自由入力</button>
      <button type="button" data-mode="game">タイムアタック</button>
    </div>
    <div id="game-bar" hidden>
      <div class="game-top">
        <div id="game-question" class="game-question"></div>
        <button type="button" id="pass-btn">パス</button>
      </div>
      <div class="game-meta">
        <span id="game-time">残り 0秒</span>
        <span id="game-score">正解 0</span>
        <span id="game-status" class="game-status"></span>
      </div>
      <div class="time-track"><div id="game-time-bar"></div></div>
    </div>
    <form id="search-form" autocomplete="off">
      <!-- inputmode="none": スマホでは画面のテンキーで入力するので、端末のキーボードは出さない -->
      <input id="zip-input" type="text" inputmode="none" maxlength="8"
             placeholder="例: 100-0001" aria-label="郵便番号">
    </form>
    <div id="result" class="result" aria-live="polite">郵便番号を1桁ずつ入力すると、該当する地域が絞り込まれます</div>
  </header>

  <main id="map-wrap">
    <svg id="map" role="img" aria-label="日本地図"></svg>
    <div id="loading">地図を読み込み中…</div>
    <div id="game-card" class="game-card" hidden></div>
    <div class="map-buttons">
      <button type="button" id="zoom-in" aria-label="拡大">＋</button>
      <button type="button" id="zoom-out" aria-label="縮小">－</button>
      <button type="button" id="reset-btn" aria-label="全国表示">全国</button>
    </div>
  </main>

  <section id="keypad" aria-label="テンキー">
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" id="clear-btn" class="sub">クリア</button>
    <button type="button" data-key="0">0</button>
    <button type="button" id="bs-btn" class="sub" aria-label="1文字削除">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 9.5l5 5M17 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </section>

  <footer>
    出典：「国土数値情報（行政区域データ）」（国土交通省）を加工して作成（2021年1月1日時点の境界）／
    加工データ：スマートニュース メディア研究所 japan-topography／
    郵便番号データ：日本郵便（yubinbango-data 経由）／
    町の位置：Geolonia 住所データ（CC BY 4.0）／
    町丁目の境界：政府統計の総合窓口（e-Stat）国勢調査2020 町丁・字等別境界データを加工して作成
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="app.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
